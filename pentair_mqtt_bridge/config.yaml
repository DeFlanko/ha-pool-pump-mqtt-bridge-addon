name: "Pentair MQTT Bridge"
version: "0.6.1"
slug: "pentair_mqtt_bridge"
description: "Bridge a Pentair pool pump over MQTT, decode status, and publish control/state topics."
url: "https://github.com/DeFlanko/ha-pool-pump-mqtt-bridge-addon"
startup: services
boot: auto
init: false
arch:
  - amd64
MQTT Settings:
  broker: ""
  port: 1883
  username: ""
  password: ""
MQTT Topics:
  topic_up: "D4AD20CF144A/up"
  topic_down: "D4AD20CF144A/down"
  parsed_base: "pentair/pump/status"
  cmd_base: "pentair/pump/cmd"
  discovery_base: "homeassistant"
  discovery_prefix: "pentair_pump"
Pool Pump Settings:
  ctrl_addr: 33
  pump_addr: 96
  low_rpm: 1650
  high_rpm: 3450
  speed1_rpm: 1650
  speed2_rpm: 2000
  speed3_rpm: 2500
  speed4_rpm: 3450
Pool Pump Controls:
  enable_discovery: true
  cleaning_mode: false
  poll_interval_minutes: 15
  control_release_seconds: 60
  min_command_interval_seconds: 1.0
schema:
  broker: str
  port: port
  username: str?
  password: password?
  topic_up: str
  topic_down: str
  parsed_base: str
  cmd_base: str
  discovery_base: str
  discovery_prefix: str
  ctrl_addr: int
  pump_addr: int
  low_rpm: int
  high_rpm: int
  speed1_rpm: int?
  speed2_rpm: int?
  speed3_rpm: int?
  speed4_rpm: int?
  enable_discovery: bool
  poll_interval_minutes: int?
  control_release_seconds: int?
  min_command_interval_seconds: float?
  cleaning_mode: bool?
changelog:
  "0.6.0": >-
    Added cumulative energy sensor (kWh) derived from watt telemetry.
    Publishes to <parsed_base>/energy_kwh with MQTT discovery metadata
    (device_class: energy, state_class: total_increasing, unit: kWh) so the
    pump can be added to the Home Assistant Energy Dashboard under Device
    energy consumption. Energy is accumulated by integrating watt samples over
    time, is monotonically increasing, and is persisted across restarts in
    /data/energy_kwh.json. Existing power sensor (W) is unchanged.
  "0.5.0": >-
    Simplified configuration: control mode is now always on-demand and startup
    polling is always active for 5 seconds before returning to passive mode.
    Replaced status_poll_mode/status_poll_interval/status_poll_interval_seconds
    with poll_interval_minutes (default 15, 0 = continuous while active).
    Added timezone-aware local log timestamps, startup timezone logging, and
    last poll telemetry topics/discovery sensors
    (<parsed_base>/last_poll_epoch and <parsed_base>/last_poll_local).
  "0.4.1": >-
    Orangize the Config menu
  "0.4.0": >-
    Pump Off fix: reworked off command to use action 0x06 with payload 03 21 00 00
    (stop/program-0) per the Pentair packet spec, replacing the previous no-op payload.
    Polling default: status_poll_interval_seconds now defaults to 900 s (15 minutes)
    to reduce RS-485 bus traffic and avoid locking the pump display.
    Speed 1-4 controls: replaced Pump Low / Pump High discovery buttons with
    four configurable Speed 1-4 buttons (cmd_base/speed/1-4); RPM for each slot
    is set via speed1_rpm-speed4_rpm config options. Low/high topics remain as
    backward-compatible aliases.
    Improved decoder: Pump Mode and Pump Drive State now publish human-readable
    labels (e.g. "Feature 1", "Speed 2", "Stopped") in addition to raw values.
    Schedule enabled now correctly reads bit 2 (0x04) of the run byte.
    Device sw_version bumped to 0.4.0.
  "0.3.0": >-
    Polling enhancements: configurable interval (status_poll_interval_seconds,
    default 30s), immediate poll on startup and MQTT reconnect, and an
    immediate refresh when cleaning mode is disabled.
    Cleaning mode: new config option and runtime MQTT switch
    (pentair/pump/cmd/set/cleaning_mode) that pauses RS-485 polling so the
    physical panel remains freely usable during maintenance; state published
    to pentair/pump/status/cleaning_mode.
    Schedule enabled: schedule-running state derived from run-byte bit 2 and
    published to pentair/pump/status/schedule_enabled (read-only; binary_sensor
    in HA discovery).
    Speed 1-4 preset visibility: live RPM published to
    pentair/pump/status/speed/{1-4}/rpm when the pump reports operating on a
    numbered preset, so each button's configured RPM is visible in HA.
    MQTT discovery: added entities for cleaning mode switch, schedule enabled
    binary sensor, and speed 1-4 RPM sensors.
    Device sw_version bumped to 0.3.0.
  "0.2.2": "Default target RPM for new/default installs is now 1650 instead of 2000."
  "0.2.1": >-
    On-demand control mode: bridge releases the RS-485 bus after a configurable
    timeout so the pump keypad becomes usable again.
    Passive status polling mode (STATUS_POLL_MODE=passive) stops TX AUTO STATUS
    frames entirely, letting the keypad stay active while still receiving
    telemetry from uplink frames.
    Related logging and configuration improvements.
  "0.2.0": "Initial on-demand control mode and MQTT bridge release."
